name: Build AudioCaptureProbe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source.zip
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf project
          mkdir -p project
          unzip -q source.zip -d project
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/app/audiocaptureprobe-debug.jks
          test -f project/app/src/main/AndroidManifest.xml

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E "versionName[[:space:]]+['\"]" project/app/build.gradle | head -1 | sed -E "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Source version: $VERSION"

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --no-build-cache :app:assembleDebug --stacktrace

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euxo pipefail
          SRC="project/app/build/outputs/apk/debug/app-debug.apk"
          DST="AudioCaptureProbe-v${{ steps.version.outputs.version }}.apk"
          test -f "$SRC"
          cp -f "$SRC" "$DST"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$DST" | head -n 1
          ls -lh "$DST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioCaptureProbe-v${{ steps.version.outputs.version }}
          path: AudioCaptureProbe-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14
