name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source.zip
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -q source.zip -d project
          echo "--- extracted root ---"
          ls -la project
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK with version
        shell: bash
        run: |
          VERSION=$(grep -E "versionName[[:space:]]+['\"]" project/app/build.gradle | head -1 | sed -E "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")
          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi
          cp project/app/build/outputs/apk/debug/app-debug.apk "AudioCaptureProbe-v${VERSION}.apk"
          echo "APK_NAME=AudioCaptureProbe-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioCaptureProbe-v0.1.0
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
